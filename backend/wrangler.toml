# Cloudflare Worker config for the Pause AI backend.
# Secrets (API keys) are NOT stored here. Add them with:
#   npx wrangler secret put ANTHROPIC_API_KEY
name = "pause-ai"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
PROVIDER = "openai"
OPENAI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
MODEL ="gemini-3.5-flash-lite"
ALLOWED_ORIGINS = "https://nbhumika07.github.io,http://localhost:8787"
RATE_LIMIT = "40"