  <script>
    /* Apply the saved theme before first paint to avoid a flash. */
    try { var p = JSON.parse(localStorage.getItem('pause-prefs') || '{}'); if (p.theme && p.theme !== 'system') document.documentElement.dataset.theme = p.theme; if (p.reduceMotion) document.documentElement.classList.add('reduce-motion'); } catch (e) {}
  </script>
